<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Slice of Life</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="styles/landing.css">
</head>
<body>
  <main class="container">
    <div style="max-width: 380px; margin: 4rem auto;">
      <header style="text-align: center; margin-bottom: 2.5rem;">
        <h1 style="margin: 0; font-size: 3rem;">S🍋L</h1>
      </header>
      
      <!-- Email/Password Login -->
      <form id="login-form" style="margin-bottom: 0;">
        <input type="email" name="email" placeholder="Email" required style="margin-bottom: 1rem;" />
        <input type="password" name="password" placeholder="Password" required style="margin-bottom: 1rem;" />
        <button type="submit" style="width: 100%; margin-bottom: 0;">Login</button>
      </form>
      
      <div style="text-align: center; margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.875rem;">or</div>
      
      <!-- OAuth Login -->
      <button id="google-login" class="contrast" style="width: 100%; margin-bottom: 0;">
        Continue with Google
      </button>
      
      <footer style="text-align: center; margin-top: 2.5rem;">
        <a href="/" style="color: var(--accent); text-decoration: none; font-size: 0.875rem;">← Back to home</a>
      </footer>
    </div>
  </main>
  
  <script type="module">
    import { pb } from './scripts/pb.js';
    
    // Email/Password login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      try {
        await pb.collection('users').authWithPassword(
          formData.get('email'),
          formData.get('password')
        );
        window.location.href = '/app/dashboard.html';
      } catch (err) {
        alert('Login failed: ' + err.message);
      }
    });
    
    // Google OAuth login
    document.getElementById('google-login').addEventListener('click', async () => {
      try {
        const authData = await pb.collection('users').authWithOAuth2({ provider: 'google' });
        window.location.href = '/app/dashboard.html';
      } catch (err) {
        alert('OAuth failed: ' + err.message);
      }
    });
  </script>
</body>
</html>
