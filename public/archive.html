<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Archive - Carson Brown</title>
  <link rel="stylesheet" href="styles/landing.css">
  <style>
    .archive-container {
      min-height: 100vh;
      padding: 120px clamp(1.5rem, 10vw, 10rem);
      max-width: 1200px;
      margin: 0 auto;
    }

    .archive-header {
      margin-bottom: 4rem;
    }

    .archive-header h1 {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .archive-header p {
      color: var(--text-secondary);
      font-size: 1.125rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      margin-bottom: 2rem;
      transition: var(--transition);
    }

    .back-link:hover {
      transform: translateX(-5px);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .project-card {
      background: rgba(100, 255, 218, 0.03);
      border: 1px solid rgba(204, 214, 246, 0.1);
      border-radius: 8px;
      padding: 2rem;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: rgba(100, 255, 218, 0.3);
      background: rgba(100, 255, 218, 0.05);
    }

    .project-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .project-card-info {
      flex: 1;
    }

    .project-year {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .project-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .project-title a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    .project-title a:hover {
      color: var(--accent);
    }

    .project-category {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-style: italic;
    }

    .project-links {
      display: flex;
      gap: 1rem;
      flex-shrink: 0;
    }

    .project-links a {
      color: var(--text-secondary);
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .project-links a:hover {
      color: var(--accent);
    }

    .project-description {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
      margin: 0.5rem 0;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }

    .project-tech span {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(100, 255, 218, 0.1);
      padding: 0.25rem 0.625rem;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .projects-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .project-card {
        padding: 1.5rem;
      }

      .project-title {
        font-size: 1.125rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <a href="/#about">About</a>
    <a href="/#projects">Projects</a>
    <a href="/#contact">Contact</a>
    <a href="app/dashboard.html" class="lemon-link" aria-label="Login" title="Login to Slice of Life">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 100 60" fill="none">
        <path d="M 10,55 Q 10,10 50,5 Q 90,10 90,55 Z" fill="#E8D852" stroke="#D4C74A" stroke-width="3"/>
        <path d="M 18,52 Q 18,18 50,14 Q 82,18 82,52 Z" fill="#F4E87C" stroke="none"/>
        <line x1="50" y1="5" x2="50" y2="55" stroke="#E8D852" stroke-width="2"/>
        <line x1="50" y1="10" x2="25" y2="52" stroke="#E8D852" stroke-width="1.5" opacity="0.8"/>
        <line x1="50" y1="10" x2="35" y2="54" stroke="#E8D852" stroke-width="1.5" opacity="0.8"/>
        <line x1="50" y1="10" x2="65" y2="54" stroke="#E8D852" stroke-width="1.5" opacity="0.8"/>
        <line x1="50" y1="10" x2="75" y2="52" stroke="#E8D852" stroke-width="1.5" opacity="0.8"/>
      </svg>
    </a>
  </nav>

  <div class="archive-container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <div class="archive-header">
      <h1>All Projects</h1>
      <p>A complete list of things I've built</p>
    </div>

    <div class="projects-grid" id="archive-projects-container">
      <!-- Projects will be inserted here by JavaScript -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="scripts/projects-data.js"></script>
  <script>
    // Render all projects in card format
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('archive-projects-container');
      if (container) {
        const allProjects = getAllProjects();
        container.innerHTML = allProjects.map(project => {
          const githubIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>`;
          
          const externalIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>`;

          const techTags = project.technologies.map(tech => `<span>${tech}</span>`).join('');
          
          const githubLink = project.githubUrl 
            ? `<a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" aria-label="View GitHub repository">${githubIcon}</a>`
            : '';
          
          const liveLink = project.liveUrl 
            ? `<a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" aria-label="View live site">${externalIcon}</a>`
            : '';

          const projectLink = project.liveUrl || project.githubUrl || '#';

          return `
            <article class="project-card">
              <div class="project-card-header">
                <div class="project-card-info">
                  <div class="project-year">${project.year}</div>
                  <h3 class="project-title">
                    <a href="${projectLink}" target="_blank" rel="noopener noreferrer">${project.title}</a>
                  </h3>
                  <div class="project-category">${project.category}</div>
                </div>
                <div class="project-links">
                  ${githubLink}
                  ${liveLink}
                </div>
              </div>
              ${project.description ? `<p class="project-description">${project.description}</p>` : ''}
              <div class="project-tech">
                ${techTags}
              </div>
            </article>
          `;
        }).join('');
      }
    });
  </script>
  <script src="scripts/landing.js"></script>
</body>
</html>
